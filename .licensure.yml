excludes:
  - \.gitignore
  - .*lock
  - \.git/.*
  - \.licensure\.yml
  - LICENSE
  - .*\.(md|rst|txt)

licenses:
  - files: any
    ident: Apache-2.0
    authors:
      - name: Enlightware GmbH
    template: |
      Copyright [year] [name of author]
      SPDX-License-Identifier: [ident]
    unwrap_text: false
    replaces:
      - '(?ms)^// Copyright [0-9 ,\-]+ Enlightware GmbH\n(?://\n)?// Licensed under the Apache License, Version 2\.0 .*?limitations under the License\.\n(?://\n)?'
      - '(?m)^// Copyright [0-9 ,\-]+ Enlightware GmbH\n// Licensed under the Apache License, Version 2\.0\.\n'

comments:
  - extensions:
      - js
      - ts
      - rs
      - go
    commenter:
      type: line
      comment_char: "//"
      trailing_lines: 1
  - extensions:
      - css
      - cpp
      - c
    commenter:
      type: block
      start_block_char: "/*\n"
      end_block_char: "*/"
      per_line_char: "*"
      trailing_lines: 0
  - extension: html
    commenter:
      type: block
      start_block_char: "<!--\n"
      end_block_char: "-->"
  - extensions:
      - el
      - lisp
    commenter:
      type: line
      comment_char: ";;;"
      trailing_lines: 0
  - extension: any
    commenter:
      type: line
      comment_char: '#'
      trailing_lines: 0
