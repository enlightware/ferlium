[package]
name = "ferlium-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
barkus-core = { git = "https://github.com/DataDog/barkus.git", rev = "7b55ee372cbbd9307bbcea43f2e1ec36e7e199a8", package = "barkus-core" }
barkus-ebnf = { git = "https://github.com/DataDog/barkus.git", rev = "7b55ee372cbbd9307bbcea43f2e1ec36e7e199a8", package = "barkus-ebnf" }
ferlium = { path = ".." }
arbitrary = "1.4"
libfuzzer-sys = "0.4"

[[bin]]
name = "grammar_optimization_differential"
path = "fuzz_targets/grammar_optimization_differential.rs"
test = false
doc = false
bench = false

[[bin]]
