name: Cargo Build & Test

on: [push, pull_request]

jobs:
  rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        toolchain: [stable] # beta, nightly
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust with linting tools
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Rust
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: ${{ runner.os }}-cargo

      - name: Check formatting
        if: runner.os != 'macOS'
        run: cargo fmt --check

      - name: Run Clippy (Linting)
        if: runner.os != 'macOS'
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true

      - name: Run local tests
        # The dual-backend suite runs every snippet through both interpreters; at the 128-frame
        # call-depth limit the unoptimized interpreters need more than the default test-thread
        # stack on macOS.
        run: cargo nextest run
        env:
          RUST_MIN_STACK: "8388608"

  wasm_build:
    name: Build WASM tests
    runs-on: ubuntu-latest
    outputs:
      wasm_bindgen: ${{ steps.versions.outputs.wasm_bindgen }}
    env:
      # The language test binary is large enough that loading its full DWARF data can leave Chrome's renderer unresponsive to WebDriver.
      # Keep debug assertions, omit debuginfo, and use light optimization so browsers do not
      # spend minutes compiling the otherwise very large opt-level-0 test module.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: ${{ runner.os }}-cargo

      - name: Determine wasm-bindgen version
        id: versions
        # The test runner must match the wasm-bindgen crate exactly.
        run: echo "wasm_bindgen=$(cargo pkgid -p wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"

      - name: Install WABT for native ABI probes
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: Check Rust native entry Wasm signatures
        run: python3 tests/native_abi/check_wasm.py

      - name: Build WASM test binaries
        # The Wasm test binaries do not depend on the host, so they are built once here and run by
        # the jobs below. The playground is built separately so that its ferlium feature set is
        # not unified into the ferlium tests.
        shell: bash
        run: |
          set -euo pipefail
          collect() {
            local dir=wasm-tests/$1
            shift
            mkdir -p "$dir"
            cargo test --target wasm32-unknown-unknown --no-run --message-format=json-render-diagnostics "$@" \
              | jq -r 'select(.reason == "compiler-artifact" and .executable != null) | "\(.target.name) \(.executable)"' \
              | while read -r name executable; do cp "$executable" "$dir/$name.wasm"; done
          }
          collect test -p ferlium --lib --test language
          collect test -p script-api --lib
          collect release --release -p ferlium --lib --test language
          for file in test/ferlium test/language test/script_api release/ferlium release/language; do
            test -f "wasm-tests/$file.wasm"
          done
          ls -l wasm-tests/*

      - name: Upload WASM test binaries
        uses: actions/upload-artifact@v7
        with:
          name: wasm-tests
          path: wasm-tests
          if-no-files-found: error
          retention-days: 1

  wasm_browser:
    name: WASM tests (${{ matrix.browser }})
    needs: wasm_build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - browser: Chrome
            os: ubuntu-latest
            webdriver: CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver
          - browser: Firefox
            os: ubuntu-latest
            webdriver: GECKODRIVER=$GECKOWEBDRIVER/geckodriver
          - browser: Safari
            os: macos-latest
            webdriver: SAFARIDRIVER=/usr/bin/safaridriver
    env:
      WASM_BINDGEN_USE_BROWSER: "1"
      WASM_BINDGEN_TEST_TIMEOUT: "600"
    steps:
      - name: Download WASM test binaries
        uses: actions/download-artifact@v8
        with:
          name: wasm-tests
          path: wasm-tests

      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ needs.wasm_build.outputs.wasm_bindgen }}

      - name: Select WebDriver
        # The runner images provide drivers matching their installed browsers.
        run: echo "${{ matrix.webdriver }}" >> "$GITHUB_ENV"

      - name: Run WASM library tests (${{ matrix.browser }})
        run: wasm-bindgen-test-runner wasm-tests/test/ferlium.wasm

      - name: Run WASM language tests (${{ matrix.browser }})
        run: wasm-bindgen-test-runner wasm-tests/test/language.wasm

      - name: Run Playground WASM tests (${{ matrix.browser }})
        run: wasm-bindgen-test-runner wasm-tests/test/script_api.wasm

      - name: Check release Wasm linkage and generation (${{ matrix.browser }})
        run: 'wasm-bindgen-test-runner wasm-tests/release/ferlium.wasm wasm::'

  wasm_node:
    name: Optimized WASM language tests (Node)
    needs: wasm_build
    runs-on: ubuntu-latest
    steps:
      - name: Download WASM test binaries
        uses: actions/download-artifact@v8
        with:
          name: wasm-tests
          path: wasm-tests

      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ needs.wasm_build.outputs.wasm_bindgen }}

      - name: Run optimized WASM language tests
        run: wasm-bindgen-test-runner wasm-tests/release/language.wasm

  build_site:
    name: Build and upload playground and book
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: ${{ runner.os }}-cargo

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Build Playground
        working-directory: playground
        run: make build

      - name: Install mdBook
        run: |
          mkdir -p $HOME/mdbook
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-musl.tar.gz | tar -xz --directory=$HOME/mdbook
          echo "$HOME/mdbook" >> $GITHUB_PATH

      - name: Build Book
        run: mdbook build docs/book/en

      - name: Prepare site directory
        run: |
          mkdir -p site
          mv playground/dist site/playground
          mv docs/book/en/book site/book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  validate_lezer_grammar:
    name: Validate Lezer grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install npm dependencies
        run: make install-npm-deps

      - name: Validate Lezer grammar
        run: make validate-grammar

  playground_tests:
    name: Playground unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install npm dependencies
        run: npm install

      - name: Run playground unit tests
        run: npm test

  deploy_pages:
    name: Deploy playground and book to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - wasm_browser
      - wasm_node
      - build_site
      - validate_lezer_grammar
      - playground_tests
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
