[env]
RUST_TEST_THREADS = "1"

# At the 128-frame call-depth limit the unoptimized interpreters need more than the
# 1 MiB default wasm shadow stack. Generated functions are installed in Rust's function
# table at runtime, so the table must also be allowed to grow.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=4194304", "-C", "link-arg=--growable-table"]
